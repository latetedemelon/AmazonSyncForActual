# Copy this file to config.ini (which is gitignored) and edit it, then run:
#   amazon-sync-for-actual -c config.ini --dry-run
#
# Every value here can also be supplied via a CLI flag or an ASFA_* environment
# variable. Precedence: CLI flag > environment variable > this file > defaults.

[actual]
# URL of your Actual *sync server* (the same one the Actual app syncs to).
url = http://localhost:5006
# Server password (what you type to unlock the web UI). Prefer the ASFA_ACTUAL_PASSWORD
# environment variable over storing it here.
password = your_actual_server_password
# Budget name as shown in Actual, or its sync id.
file = My Budget
# Only needed if your budget file is end-to-end encrypted.
# encryption_password =
# Optionally restrict to a single account by name.
# account = Amazon Card

[amazon]
# "csv" (recommended) or "selenium" (experimental).
source = csv
# Path to the CSV file, a directory of CSVs, or the raw export ZIP from
# Amazon's "Request My Data" -> "Your Orders" download.
csv_path = ./Retail.OrderHistory.1.csv

# Only used when source = selenium (experimental, fragile):
# email = your_amazon_email
# password = your_amazon_password
# otp_secret = your_totp_secret
# pages = 3

[matching]
# Look back this many days when no explicit start/end is given.
days = 90
# start_date = 2024-01-01
# end_date = 2024-12-31
# How far apart (days) a charge and an order date may be and still match.
date_window_days = 5
# Allowed rounding difference between a charge and an order/shipment total (cents).
tolerance_cents = 0
# Case-insensitive regex identifying Amazon payees.
# payee_regex = amazon|amzn
# Set to false to match whole-order totals only.
match_shipments = true
# Set to true to also annotate refunds (positive amounts).
include_positive = false

[memo]
# How to write the note: fill (only if empty), prepend, append, or overwrite.
mode = fill
# Split a matched transaction into one child per item instead of writing a note.
# "off" (default) or "items". Splitting only happens when item amounts reconcile
# to the charge exactly (real per-item prices); otherwise it falls back to a note.
split_mode = off
max_words_per_item = 8
# 0 = no limit; otherwise show this many items then "+N more".
max_items = 0
# Note: INI strips surrounding spaces, so the built-in default " | " is used
# unless you set this. Override only if you want a different separator.
# separator = ,
include_quantity = true
# prefix = Amazon:
# Cap the overall note length (0 = no cap).
max_length = 0

# Local bridge for the browser extension (used with `--serve`).
[bridge]
host = 127.0.0.1
port = 5007
# Require this token (sent as the X-ASFA-Token header) on bridge writes.
# token = choose-a-secret

[behaviour]
dry_run = false
verbose = false
